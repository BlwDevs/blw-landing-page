<!doctype html>
<!-- tipo: software (empresa de desenvolvimento que também vende produtos próprios).
     Deal do taste-skill: hero word (palavra viva), nav-mega, footer-dark, close-type, rhythm space, buttons solid (o tonal dava 1,2:1 de contraste no fundo escuro: sorteado de novo);
     momento: word-highlight na frase logo abaixo do hero. Cores e fonte são as do guia de identidade BLW
     (violeta #615afb e Asap), passadas por `start.mjs brand`: a regra "nunca violeta" vale para
     paletas sorteadas, não para a marca do próprio cliente. -->
<html lang="pt-BR" data-type="software" data-radius="soft" data-buttons="solid" data-motion>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BLW Devs: IA e software sob medida para empresas, startups e agronegócio</title>
  <meta name="description"
    content="Software e inteligência artificial sob medida para o agronegócio do Vale do São Francisco, empresas tradicionais e startups. Petrolina, PE." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BLW Devs: IA e software sob medida para empresas, startups e agronegócio" />
  <meta property="og:description"
    content="Projetos sob demanda e parceria de execução para startups financiadas, com metodologia própria de nove etapas." />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:image" content="/share.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0c0b18" />
  <meta name="site-kind" content="software" />
  <meta name="page-type" content="software" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Asap:wdth,wght@75..125,400..500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/system.css" />
  <link rel="stylesheet" href="/assets/ui/cards.css" />
  <link rel="stylesheet" href="/assets/motion/motion.css" />
  <link rel="stylesheet" href="/assets/layout/layout.css" />
  <link rel="stylesheet" href="/assets/icons/icon.css" />
  <style>
    :root {
      --p-bg: #0c0b18; --p-surface: #151421; --p-ink: #f1f1f8; --p-muted: #888892;
      --p-accent: #615afb; --p-accent-ink: #ffffff; --p-action: #615afb; --p-action-ink: #ffffff;
      --p-inv-bg: #f1f1f8; --p-inv-surface: #dedee6; --p-inv-ink: #0c0b18; --p-inv-muted: #585764;
      --p-inv-accent: #615afb; --p-inv-accent-ink: #ffffff; --p-inv-action: #615afb; --p-inv-action-ink: #ffffff;
      --font-display: "Asap", system-ui, sans-serif;
      --font-text: "Asap", system-ui, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --display-weight: 500;
      --display-tracking: -0.035em;
      --display-tracking-xl: -0.045em;
      /* chão aceso atrás das janelas de interface: violeta-noite da marca (o kit traz bege, azul e verde) */
      --ground-bg: #1d1b4e; --ground-surface: #2a2870; --ground-ink: #f1f1f8; --ground-muted: #b9b8d6; --ground-accent: #8b85ff;
    }
  </style>
  <!-- entrada do hero (motion.md): as palavras esperam o motion.js em vez de piscar -->
  <script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
  <!-- momento word-highlight (moments.md): a guarda e o preload do núcleo e do momento sorteado -->
  <script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
  <link rel="modulepreload" href="/assets/moments/moments.js" />
  <link rel="modulepreload" href="/assets/moments/lib.js" />
  <link rel="modulepreload" href="/assets/moments/word-highlight/moment.js" />
</head>

<body>
  <header class="nav" id="nav-root"></header>
  <main id="top"></main>
  <footer class="footer footer--dark closing" id="closing-root" aria-labelledby="close-h"></footer>
  <script type="module" src="/src/main.tsx"></script>
  <!-- O loader da RD Station NÃO fica aqui de propósito: ele é injetado por
       src/services/consent.ts somente após o aceite no banner de cookies.
       Os scripts do kit (system.js, layout.js, motion.js) são carregados por src/kit.ts
       depois que o React desenha a página, porque eles leem o DOM pronto. -->
</body>

</html>
